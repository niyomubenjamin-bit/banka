<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banka - Admin Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div id="app">
        <nav class="dashboard-navbar">
            <div class="navbar-content">
                <div class="navbar-brand">
                    <i class="fas fa-university"></i> Banka Admin
                </div>
                <div class="navbar-links">
                    <a class="nav-link active" onclick="switchAdminTab('overview')">Overview</a>
                    <a class="nav-link" onclick="switchAdminTab('users')">Users</a>
                    <a class="nav-link" onclick="switchAdminTab('accounts')">Accounts</a>
                </div>
                <div class="navbar-user">
                    <span class="user-name" id="admin-name">Admin</span>
                    <span class="logout-btn" onclick="handleLogout()">Logout</span>
                </div>
            </div>
        </nav>

        <div class="dashboard-container">
            <div id="dashboard-content">
                <!-- Content will be loaded here -->
                <p>Loading...</p>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="create-user-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create New User</h3>
                <span class="close-button" onclick="closeModal('create-user-modal')">&times;</span>
            </div>
            <div class="modal-body">
                <form id="create-user-form" onsubmit="handleAdminCreateUser(event)">
                    <div class="form-group">
                        <label for="new-user-first-name">First Name</label>
                        <input type="text" id="new-user-first-name" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="new-user-last-name">Last Name</label>
                        <input type="text" id="new-user-last-name" name="lastName" required>
                    </div>
                    <div class="form-group">
                        <label for="new-user-email">Email</label>
                        <input type="email" id="new-user-email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="new-user-password">Password</label>
                        <input type="password" id="new-user-password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label for="new-user-role">Role</label>
                        <select id="new-user-role" name="role" required>
                            <option value="staff">Staff</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <button type="submit" class="button button-primary">Create User</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/admin_dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', initAdminDashboard);
    </script>
</body>

</html>
